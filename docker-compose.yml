services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_agent_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - personal-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personal_agent} -d ${POSTGRES_DB:-personal_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  personal-agent-postgres-data:
